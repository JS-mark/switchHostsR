[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package]
name = "switch-hosts-r"
version = "0.0.1"
description = "Tauri App, switch hosts"
authors = ["The Mark"]
license = "MIT"
repository = "https://github.com/JS-mark/switchHostsR"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.116"
serde = { version = "1.0.202", features = ["derive"] }
tauri = { version = "2.0.2", features = [
  "macos-private-api",
  "image-ico",
  "image-png",
  "tray-icon",
] }
chrono = { version = "0.4.38", features = ["serde"] }
diesel = { version = "2.1.6", features = ["sqlite", "r2d2"] }
r2d2 = "0.8.11"
dotenv = "0.15.1"
rust-crypto = "0.2.37"
bcrypt = "0.15.2"
sysinfo = "0.30.9"
window-vibrancy = "0.5.3"
tauri-plugin-os = "2.0.2"
tauri-plugin-fs = "2.0.2"
tauri-plugin-dialog = "2.0.2"
tauri-plugin-clipboard-manager = "2.0.2"
tauri-plugin-notification = "2.0.2"
tauri-plugin-process = "2.0.2"
tauri-plugin-http = "2.0.2"
tauri-plugin-shell = "2.0.2"
log = "0.4.22"
env_logger = "0.11.3"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.0.2"
